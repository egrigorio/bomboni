name: Autonomous PR Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 1. Guardrails Deterministicos (Hard Gates)
  deterministic-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar Sintaxe JavaScript
        run: |
          node -c src/bomboni/adapters/web/static/app.js
          node -c src/bomboni/adapters/web/static/service-worker.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Testes Unitarios e Smoke Test PWA
        run: |
          pip install -e ".[dev]"
          python -m compileall -q src tests scripts
          playwright install chromium
          pytest

  # 2. Guardrails Nao Deterministicos (Revisao Semantica com IA)
  ai-semantic-gate:
    needs: deterministic-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspecao Semantica do Diff
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pip install google-genai
          python scripts/ai_semantic_review.py

  # 3. Auto-Merge (Executado apenas com 100% de aprovacao anterior)
  auto-merge:
    needs: [deterministic-gates, ai-semantic-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Realizar Merge Automatico
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Aprova o PR formalmente e faz o squash merge deletando a branch
          gh pr review "$PR_URL" --approve -b "Todos os guardrails passaram. Merge automatico autorizado."
          gh pr merge "$PR_URL" --squash --delete-branch --admin || gh pr merge "$PR_URL" --squash --delete-branch
