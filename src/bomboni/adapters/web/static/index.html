<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#f5f3ed">
    <meta name="description" content="Encontre refeições de boni perto de si, com menus traduzidos para o seu idioma.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bomboni">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=ios-bottom-nav-hours-1">
    <title>Bomboni — refeições perto de si</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Bomboni início">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 4v9M13 4v9M17 4v9M13 13v15M24 4c-3 4-4 9-4 14h5v10"/></svg></span>
          <span class="brand-word">bomboni<span class="brand-period">.</span></span>
        </a>
        <div class="topbar-actions">
          <button class="location-chip" id="location-button" type="button"><span class="live-dot"></span><span id="location-label">Eslovénia</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
          <label class="language-picker" aria-label="Idioma">
            <span class="globe" aria-hidden="true">◎</span>
            <select id="language-select">
              <option value="pt">PT</option><option value="en">EN</option><option value="es">ES</option>
              <option value="de">DE</option><option value="it">IT</option><option value="fr">FR</option>
            </select>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
          </label>
          <button class="install-button" id="install-button" type="button" hidden aria-label="Instalar aplicação">↓</button>
        </div>
      </header>

      <main class="layout" id="layout">
        <section class="discovery" id="discovery-panel">
          <h1 id="hero-title">Restaurantes com boni</h1>

          <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
            <input id="search-input" type="search" autocomplete="off" placeholder="Restaurante, rua ou cidade…" aria-label="Pesquisar restaurante, rua ou cidade">
          </div>

          <div class="list-heading">
            <div><h2 id="list-title">Restaurantes</h2></div>
            <span class="result-count" id="result-count">—</span>
          </div>
          <div class="restaurant-list" id="restaurant-list" aria-live="polite">
            <div class="loading-card"><span class="spinner"></span><span id="loading-label">A encontrar restaurantes…</span></div>
          </div>
          <button class="load-more" id="load-more" type="button" hidden>Ver mais</button>
        </section>

        <section class="menu-panel" id="menu-panel" aria-live="polite" hidden>
          <div class="menu-content" id="menu-content" hidden>
            <button class="back-button" id="back-button" type="button"><span>←</span><span id="back-label">Todos os restaurantes</span></button>
            <div class="venue-heading">
              <div class="venue-avatar" id="venue-avatar">B</div>
              <div class="venue-title-wrap"><h2 id="venue-name"></h2><p id="venue-address"></p></div>
              <a class="source-link" id="source-link" target="_blank" rel="noreferrer" aria-label="Abrir fonte oficial">↗</a>
            </div>
            <div class="venue-meta"><span class="meta-item"><span class="meta-icon">€</span><span id="venue-fee"></span></span></div>
            <div class="menu-divider"><div class="date-heading"><button class="date-arrow" id="date-prev" type="button" aria-label="Dia anterior">‹</button><h3 id="menu-title">Pratos de hoje</h3><button class="date-arrow" id="date-next" type="button" aria-label="Dia seguinte">›</button></div></div>
            <div class="dish-list" id="dish-list"></div>
          </div>
        </section>
      </main>
      <footer class="footer"><button class="footer-install" id="footer-install" type="button">Instalar app ↓</button><a href="https://www.studentska-prehrana.si/en/restaurant" target="_blank" rel="noreferrer" id="footer-source">Fonte ↗</a></footer>
    </div>
    <nav class="mobile-tab-bar" id="mobile-tab-bar" aria-label="Navegação principal">
      <button class="mobile-tab active" type="button" data-tab="explore" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span data-tab-label="explore">Explorar</span>
      </button>
      <button class="mobile-tab" type="button" data-tab="nearby">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-tab-label="nearby">Perto</span>
      </button>
      <button class="mobile-tab" type="button" data-tab="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><span data-tab-label="search">Pesquisar</span>
      </button>
      <button class="mobile-tab" type="button" data-tab="language">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span data-tab-label="language">Idioma</span>
      </button>
    </nav>
    <div class="toast" id="toast" role="status"></div>
    <script src="/app.js?v=ios-bottom-nav-hours-1" defer></script>
    <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js?v=12').then(registration => registration.update()).catch(() => {}));</script>
  </body>
</html>
