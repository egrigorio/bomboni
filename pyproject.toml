[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bomboni"
version = "0.1.0"
description = "Shared data extraction and query layer for the Slovenian student meal directory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-mock>=3.14,<4"]

[project.scripts]
bomboni-mcp = "bomboni.adapters.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
