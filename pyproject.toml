[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bomboni"
version = "0.1.0"
description = "Shared data extraction and query layer for the Slovenian student meal directory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=2,<3"]
dev = ["pytest>=8,<9", "pytest-mock>=3.14,<4", "playwright>=1.40,<2"]

[project.scripts]
bomboni-mcp = "bomboni.adapters.mcp.server:main"
bomboni-web = "bomboni.adapters.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bomboni.adapters.web" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
